name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dozbyte
          POSTGRES_PASSWORD: dozbyte
          POSTGRES_DB: dozbyte
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dozbyte"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dozbyte:dozbyte@localhost:5432/dozbyte?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Database schema and migrations
        working-directory: apps/server
        run: |
          pnpm db:validate
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
