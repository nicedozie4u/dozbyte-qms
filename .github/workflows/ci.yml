name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dozbyte
          POSTGRES_DB: dozbyte
          # Throwaway CI database: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dozbyte"
          --health-interval 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://dozbyte@localhost:5432/dozbyte_e2e?schema=public
      DATABASE_URL: postgresql://dozbyte@localhost:5432/dozbyte?schema=public
      TEST_DATABASE_URL: postgresql://dozbyte@localhost:5432/dozbyte_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test databases
        run: |
          psql -h localhost -U dozbyte -d dozbyte -c 'CREATE DATABASE dozbyte_test'
          psql -h localhost -U dozbyte -d dozbyte -c 'CREATE DATABASE dozbyte_e2e'
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests (unit and integration)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install the browser for browser tests
        run: pnpm --filter @dozbyte/e2e exec playwright install --with-deps chromium
      - name: Browser tests (main user flows)
        run: pnpm --filter @dozbyte/e2e e2e
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
      - name: Database schema and migrations
        working-directory: apps/server
        run: |
          pnpm db:validate
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
