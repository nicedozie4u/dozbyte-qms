# Local development services. Start with `pnpm db:up` from the repo root.
# The site server compose file (server, web, worker, Postgres, Redis) is added in sprint 6.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dozbyte
      POSTGRES_PASSWORD: dozbyte
      POSTGRES_DB: dozbyte
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dozbyte']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
